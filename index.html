<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Salon - Sistema de Citas</title>
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) brightness(100%); cursor: pointer; opacity: 0.9; }
    </style>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white relative overflow-x-hidden">

    <!-- BACKGROUND -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden flex items-center justify-center">
        <div class="absolute w-[600px] h-[600px] bg-amber-500/10 rounded-full blur-3xl opacity-70"></div>
        <img src="logo.jpg" alt="Watermark" class="w-[85vw] max-w-[680px] opacity-[0.07] object-contain filter drop-shadow-[0_0_35px_rgba(217,119,6,0.3)]" onerror="this.style.display='none'">
        <div class="absolute inset-0 bg-gradient-to-b from-darkbg/80 via-transparent to-darkbg/95"></div>
    </div>

    <!-- HEADER -->
    <header class="bg-darkcard/90 border-b border-darkborder sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-md md:max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('book')">
                <img src="logo.jpg" class="w-10 h-10 rounded-xl object-contain bg-black border border-amber-500/30 p-0.5" onerror="this.src='https://placehold.co/100x100/121214/ffffff?text=GS'">
                <div>
                    <h1 class="font-bold text-base leading-none text-white tracking-wide">GRAVITY SALÓN</h1>
                    <span class="text-[11px] text-amber-500 font-semibold tracking-wider uppercase">Peluquería & Barbería</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <div id="cloud-badge" class="hidden flex items-center space-x-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>Nube Conectada</span>
                </div>
                <div class="flex items-center space-x-1 bg-darkbg p-1 rounded-xl border border-darkborder">
                    <button id="btn-mode-client" onclick="setMode('client')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white shadow"><i class="fa-solid fa-user mr-1"></i> Cliente</button>
                    <button id="btn-mode-admin" onclick="setMode('admin')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white"><i class="fa-solid fa-scissors mr-1"></i> Barbería</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md md:max-w-4xl mx-auto w-full px-4 py-6 flex-1 mb-20 relative z-10">
        <!-- VISTA CLIENTE -->
        <div id="view-client" class="space-y-6">
            <div class="bg-gradient-to-r from-amber-600/20 via-amber-900/10 to-transparent border border-amber-500/30 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-amber-400 font-semibold">¡Bienvenido!</p>
                    <h2 class="text-base font-bold text-white" id="user-display-name">Cliente Invitado</h2>
                </div>
                <button onclick="openAuthModal()" class="text-xs bg-amber-500/20 border border-amber-500/40 text-amber-300 px-3 py-1.5 rounded-xl">Mis Datos</button>
            </div>
            <div id="subview-book" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="services-container"></div>
                <div class="grid grid-cols-3 gap-3" id="barbers-container"></div>
                <div class="bg-darkcard border border-darkborder rounded-2xl p-4 space-y-4">
                    <label class="block text-xs font-medium text-gray-400">📅 Día de la cita</label>
                    <input type="date" id="booking-date" onchange="updateTimeSlots()" class="w-full bg-darkbg border border-darkborder rounded-xl px-4 py-2.5 text-white text-sm">
                    <div class="grid grid-cols-3 sm:grid-cols-4 gap-2" id="time-slots-container"></div>
                </div>
                <button onclick="confirmBooking()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-amber-500/25">Confirmar Reserva</button>
            </div>
        </div>

        <!-- VISTA ADMIN -->
        <div id="view-admin" class="hidden space-y-6">
            <div class="grid grid-cols-3 gap-3">
                <div onclick="toggleTodayQuickDropdown()" class="bg-darkcard border border-darkborder p-3.5 rounded-2xl cursor-pointer hover:border-amber-500/50">
                    <p class="text-[11px] text-gray-400">Citas (Sel.)</p>
                    <p class="text-xl font-bold text-white" id="stat-today-count">0</p>
                </div>
                <div class="bg-darkcard border border-darkborder p-3.5 rounded-2xl">
                    <p class="text-[11px] text-gray-400">Caja Estimada</p>
                    <p class="text-xl font-bold text-amber-400" id="stat-revenue">0€</p>
                </div>
                <div class="bg-darkcard border border-darkborder p-3.5 rounded-2xl">
                    <p class="text-[11px] text-gray-400">Ocupación</p>
                    <p class="text-xl font-bold text-emerald-400" id="stat-occupancy">0%</p>
                </div>
            </div>
            <div id="today-quick-dropdown" class="hidden bg-darkcard border border-amber-500/30 rounded-2xl p-4 shadow-xl">
                <div class="flex justify-between border-b border-darkborder pb-2 mb-2"><h4 class="text-xs font-bold text-amber-400">CITAS DEL DÍA</h4><button onclick="toggleTodayQuickDropdown()" class="text-gray-400"><i class="fa-solid fa-xmark"></i></button></div>
                <div id="today-quick-list" class="space-y-2 max-h-60 overflow-y-auto no-scrollbar"></div>
            </div>
            <div class="bg-darkcard border border-darkborder rounded-2xl p-4 space-y-3">
                <h3 class="text-xs font-bold uppercase text-amber-400">Ingresos por Profesional</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="barber-revenue-breakdown"></div>
            </div>
            <div id="admin-appointments-list" class="space-y-3"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db = null;
        let isCloudActive = false;
        const appId = 'gravity-barberia-app';

        try {
            const app = initializeApp({
                apiKey: "AIzaSyCRop035RSLpoAbecHS1VWkRdubY3d6XHY",
                authDomain: "gravity-salon-a4c07.firebaseapp.com",
                projectId: "gravity-salon-a4c07",
                storageBucket: "gravity-salon-a4c07.firebasestorage.app",
                messagingSenderId: "170531909704",
                appId: "1:170531909704:web:4a75a23f07ccca8418287d"
            });
            db = getFirestore(app);
            await signInAnonymously(getAuth(app));
            isCloudActive = true;
            document.getElementById('cloud-badge').classList.remove('hidden');

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'appointments'), (snap) => {
                window.appointments = [];
                snap.forEach(d => window.appointments.push({id: d.id, ...d.data()}));
                refreshAll();
            });
        } catch(e) { refreshAll(); }

        window.saveAppointmentToCloud = async (apt) => { if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'appointments', apt.id), apt); };
        window.deleteAppointmentFromCloud = async (id) => { if(isCloudActive) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'appointments', id)); };
    </script>

    <script>
        const SERVICES = [{ id: 's1', name: 'Corte Caballero', price: 10 }, { id: 's2', name: 'Corte + Barba', price: 13 }, { id: 's3', name: 'Completo', price: 15 }, { id: 's4', name: 'Corte Infantil', price: 8 }];
        const BARBERS = [{ id: 'b2', name: 'Alejandro', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' }, { id: 'b1', name: 'Juanmi', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150' }];
        const TIME_SLOTS = ['10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30'];
        window.appointments = JSON.parse(localStorage.getItem('gravity_appointments') || '[]');

        function getToday() { return new Date().toISOString().split('T')[0]; }
        function sendWhatsApp(phone, name, service, date, time) {
            const msg = `📅 Hola ${name}, te recordamos tu cita en Gravity Salón: ${service} el día ${date} a las ${time} h. ¡Te esperamos!`;
            window.open(`https://wa.me/34${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function refreshAll() {
            localStorage.setItem('gravity_appointments', JSON.stringify(window.appointments));
            updateTimeSlots();
            renderAdminAppointments();
        }

        function renderBarberRevenueBreakdown(date) {
            const container = document.getElementById('barber-revenue-breakdown');
            const dateApts = window.appointments.filter(a => a.date === date && a.status !== 'blocked');
            container.innerHTML = BARBERS.map(b => {
                const bApts = dateApts.filter(a => a.barberId === b.id);
                const rev = bApts.reduce((acc, a) => acc + (SERVICES.find(s => s.id === a.serviceId)?.price || 0), 0);
                return `
                    <div class="bg-darkbg p-3 rounded-xl border border-darkborder">
                        <div class="flex justify-between mb-2"><h4 class="font-bold text-xs">${b.name}</h4><span class="text-amber-400 font-bold text-sm">${rev}€</span></div>
                        <button onclick="document.getElementById('list-${b.id}').classList.toggle('hidden')" class="w-full bg-darkcard text-[10px] py-1 rounded-md">Total Citas (${bApts.length})</button>
                        <div id="list-${b.id}" class="hidden mt-2 space-y-1">
                            ${bApts.map(a => {
                                const s = SERVICES.find(sv => sv.id === a.serviceId);
                                return `<div class="bg-darkcard p-1 rounded flex justify-between items-center text-[10px]">
                                    <span>${a.time} - ${a.clientName}</span>
                                    <button onclick="sendWhatsApp('${a.clientPhone}', '${a.clientName}', '${s.name}', '${a.date}', '${a.time}')" class="text-emerald-400"><i class="fa-brands fa-whatsapp"></i></button>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderAdminAppointments() {
            const date = document.getElementById('admin-date-filter')?.value || getToday();
            renderBarberRevenueBreakdown(date);
            // Lógica adicional de renderizado...
        }

        function updateTimeSlots() { /* lógica anterior ... */ }

        document.addEventListener('DOMContentLoaded', () => {
            const d = getToday();
            ['booking-date', 'admin-date-filter', 'admin-block-date'].forEach(id => document.getElementById(id).value = d);
            refreshAll();
        });
    </script>
</body>
</html>
