<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Salón - Reserva tu Cita</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <div class="max-w-md mx-auto bg-gray-800 rounded-xl shadow-2xl overflow-hidden md:max-w-lg my-10 border border-gray-700 w-full mx-4">
        <!-- Cabecera -->
        <div class="bg-gradient-to-r from-purple-900 to-indigo-900 p-6 text-center">
            <h1 class="text-3xl font-extrabold tracking-wider text-white">GRAVITY SALÓN</h1>
            <p class="text-sm text-purple-200 mt-1">Reserva tu cita con Alejandro</p>
        </div>

        <!-- Formulario de Reserva -->
        <div class="p-6 space-y-5">
            
            <!-- 1. Profesional (Fijo: Alejandro) -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Profesional</label>
                <div class="bg-gray-700 p-3 rounded-lg border border-gray-600 flex items-center justify-between">
                    <span class="font-semibold text-white">Alejandro</span>
                    <span class="text-xs bg-purple-600 text-white px-2 py-1 rounded-full">Barbero</span>
                </div>
            </div>

            <!-- 2. Servicio (Único y sin precio) -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Servicio</label>
                <div class="bg-gray-700 p-3 rounded-lg border border-gray-600 flex items-center justify-between">
                    <span class="text-white">Cita de Peluquería</span>
                    <span class="text-xs text-gray-400 italic">Pago en el local</span>
                </div>
            </div>

            <!-- 3. Selector de Fecha -->
            <div>
                <label for="date" class="block text-sm font-medium text-gray-300 mb-2">Fecha</label>
                <input type="date" id="date" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
            </div>

            <!-- 4. Selector de Hora -->
            <div>
                <label for="time" class="block text-sm font-medium text-gray-300 mb-2">Hora disponible</label>
                <select id="time" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    <option value="">Selecciona una fecha primero</option>
                </select>
            </div>

            <!-- 5. Datos del Cliente -->
            <div class="space-y-4">
                <div>
                    <label for="clientName" class="block text-sm font-medium text-gray-300 mb-1">Tu Nombre y Apellidos</label>
                    <input type="text" id="clientName" placeholder="Ej. Juan Pérez" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
                <div>
                    <label for="clientPhone" class="block text-sm font-medium text-gray-300 mb-1">Teléfono de contacto</label>
                    <input type="tel" id="clientPhone" placeholder="Ej. 600123456" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
            </div>

            <!-- Botón de Acción -->
            <button id="bookBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg">
                Confirmar Cita
            </button>

            <!-- Mensaje de Estado -->
            <div id="statusMessage" class="text-center text-sm mt-2 hidden"></div>
        </div>
    </div>

    <!-- Script de lógica conectada a Firebase -->
    <script>
        // TODO: Reemplaza con tus credenciales originales de Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "gravity-salon",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Generar horas disponibles al cambiar la fecha y comprobar citas ocupadas en Firestore
        const dateInput = document.getElementById('date');
        const timeSelect = document.getElementById('time');

        // Establecer fecha mínima a hoy
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;

        dateInput.addEventListener('change', async () => {
            const selectedDate = dateInput.value;
            timeSelect.innerHTML = '<option value="">Cargando horas...</option>';
            
            if (!selectedDate) {
                timeSelect.innerHTML = '<option value="">Selecciona una fecha primero</option>';
                return;
            }

            // Horario base de trabajo de Alejandro (ej: de 10:00 a 14:00 y de 17:00 a 20:00 en franjas de 30 min)
            const baseHours = [
                "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30",
                "17:00", "17:30", "18:00", "18:30", "19:00", "19:30"
            ];

            try {
                // Consultar citas ya reservadas para Alejandro en esa fecha
                const snapshot = await db.collection('appointments')
                    .where('barber', '==', 'Alejandro')
                    .where('date', '==', selectedDate)
                    .get();

                const bookedHours = [];
                snapshot.forEach(doc => {
                    bookedHours.push(doc.data().time);
                });

                // Filtrar las horas que ya están ocupadas
                const availableHours = baseHours.filter(hour => !bookedHours.includes(hour));

                timeSelect.innerHTML = '';
                if (availableHours.length === 0) {
                    timeSelect.innerHTML = '<option value="">No hay horas libres para este día</option>';
                    return;
                }

                availableHours.forEach(hour => {
                    const option = document.createElement('option');
                    option.value = hour;
                    option.textContent = hour;
                    timeSelect.appendChild(option);
                });

            } catch (error) {
                console.error("Error al consultar las horas:", error);
                timeSelect.innerHTML = '<option value="">Error al cargar horas</option>';
            }
        });

        // Registrar la cita en Firestore
        document.getElementById('bookBtn').addEventListener('click', async () => {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const date = dateInput.value;
            const time = timeSelect.value;
            const statusDiv = document.getElementById('statusMessage');

            if (!name || !phone || !date || !time) {
                statusDiv.textContent = "Por favor, completa todos los campos y selecciona una hora.";
                statusDiv.className = "text-center text-sm mt-2 text-red-400";
                statusDiv.classList.remove('hidden');
                return;
            }

            try {
                await db.collection('appointments').add({
                    barber: 'Alejandro',
                    service: 'Cita de Peluquería',
                    clientName: name,
                    clientPhone: phone,
                    date: date,
                    time: time,
                    createdAt: new Date().toISOString()
                });

                statusDiv.textContent = "¡Cita reservada con éxito! Te esperamos en Gravity Salón.";
                statusDiv.className = "text-center text-sm mt-2 text-green-400";
                statusDiv.classList.remove('hidden');
                
                // Limpiar formulario y actualizar horas disponibles
                document.getElementById('clientName').value = '';
                document.getElementById('clientPhone').value = '';
                dateInput.dispatchEvent(new Event('change'));
            } catch (error) {
                console.error("Error al guardar la cita:", error);
                statusDiv.textContent = "Hubo un error al reservar. Inténtalo de nuevo.";
                statusDiv.className = "text-center text-sm mt-2 text-red-400";
                statusDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
