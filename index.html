<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Salón - Reserva tu Cita</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Contenedor Principal -->
    <div class="max-w-md mx-auto bg-gray-900 rounded-2xl shadow-2xl overflow-hidden md:max-w-lg my-10 border border-gray-800 w-full mx-4">
        
        <!-- Cabecera -->
        <div class="bg-gradient-to-r from-purple-900 via-indigo-900 to-gray-900 p-6 text-center relative">
            <div class="absolute top-4 right-4 text-purple-300 text-xl">
                <i class="fa-solid fa-scissors"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-wider text-white">GRAVITY SALÓN</h1>
            <p class="text-sm text-purple-200 mt-1">Reserva tu cita previa online</p>
        </div>

        <!-- Formulario de Reserva -->
        <div class="p-6 space-y-5">
            
            <!-- 1. Selección de Profesional -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fa-solid fa-user-tie text-purple-400 mr-1"></i> Selecciona Profesional
                </label>
                <div class="grid grid-cols-2 gap-3" id="barberSelection">
                    <button type="button" data-barber="Alejandro" class="barber-btn bg-purple-600 text-white p-3 rounded-xl border border-purple-500 font-semibold text-center transition-all shadow-md">
                        Alejandro
                    </button>
                    <button type="button" data-barber="Juanmi" class="barber-btn bg-gray-800 text-gray-300 p-3 rounded-xl border border-gray-700 font-semibold text-center transition-all hover:bg-gray-700">
                        Juanmi
                    </button>
                </div>
            </div>

            <!-- 2. Selección de Servicio -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fa-solid fa-list-check text-purple-400 mr-1"></i> Servicio
                </label>
                <select id="serviceSelect" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    <option value="Corte de Pelo|12€">Corte de Pelo - 12€</option>
                    <option value="Corte y Barba|15€">Corte y Barba - 15€</option>
                    <option value="Barba|8€">Barba - 8€</option>
                </select>
            </div>

            <!-- 3. Selector de Fecha -->
            <div>
                <label for="date" class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fa-solid fa-calendar-days text-purple-400 mr-1"></i> Fecha
                </label>
                <input type="date" id="date" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
            </div>

            <!-- 4. Selector de Hora -->
            <div>
                <label for="time" class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fa-solid fa-clock text-purple-400 mr-1"></i> Hora disponible
                </label>
                <select id="time" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    <option value="">Selecciona una fecha primero</option>
                </select>
            </div>

            <!-- 5. Datos del Cliente -->
            <div class="space-y-4 pt-2 border-t border-gray-800">
                <div>
                    <label for="clientName" class="block text-sm font-medium text-gray-300 mb-1">Tu Nombre y Apellidos</label>
                    <input type="text" id="clientName" placeholder="Ej. Carlos Pérez" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
                <div>
                    <label for="clientPhone" class="block text-sm font-medium text-gray-300 mb-1">Teléfono de contacto</label>
                    <input type="tel" id="clientPhone" placeholder="Ej. 600123456" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
            </div>

            <!-- Botón de Acción -->
            <button id="bookBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-lg shadow-purple-900/30">
                Confirmar Cita
            </button>

            <!-- Mensaje de Estado -->
            <div id="statusMessage" class="text-center text-sm mt-3 hidden font-medium"></div>
        </div>
    </div>

    <!-- Pie de página -->
    <footer class="text-center py-4 text-xs text-gray-500">
        Gravity Salón &copy; 2026 - Todos los derechos reservados
    </footer>

    <!-- Script de lógica de Firebase y aplicación -->
    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            // Inserta aquí tus credenciales originales de Firebase
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "gravity-salon",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let selectedBarber = 'Alejandro';

        // Lógica de selección de barbero
        const barberButtons = document.querySelectorAll('.barber-btn');
        barberButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                barberButtons.forEach(b => {
                    b.classList.remove('bg-purple-600', 'border-purple-500', 'text-white');
                    b.classList.add('bg-gray-800', 'border-gray-700', 'text-gray-300');
                });
                btn.classList.remove('bg-gray-800', 'border-gray-700', 'text-gray-300');
                btn.classList.add('bg-purple-600', 'border-purple-500', 'text-white');
                selectedBarber = btn.getAttribute('data-barber');
                
                // Si ya hay una fecha seleccionada, recargar las horas del nuevo barbero
                if (dateInput.value) {
                    dateInput.dispatchEvent(new Event('change'));
                }
            });
        });

        const dateInput = document.getElementById('date');
        const timeSelect = document.getElementById('time');

        // Establecer fecha mínima a hoy
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;

        // Cargar horas disponibles basadas en Firestore
        dateInput.addEventListener('change', async () => {
            const selectedDate = dateInput.value;
            timeSelect.innerHTML = '<option value="">Cargando horas...</option>';
            
            if (!selectedDate) {
                timeSelect.innerHTML = '<option value="">Selecciona una fecha primero</option>';
                return;
            }

            const baseHours = [
                "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30",
                "17:00", "17:30", "18:00", "18:30", "19:00", "19:30"
            ];

            try {
                const snapshot = await db.collection('appointments')
                    .where('barber', '==', selectedBarber)
                    .where('date', '==', selectedDate)
                    .get();

                const bookedHours = [];
                snapshot.forEach(doc => {
                    bookedHours.push(doc.data().time);
                });

                const availableHours = baseHours.filter(hour => !bookedHours.includes(hour));

                timeSelect.innerHTML = '';
                if (availableHours.length === 0) {
                    timeSelect.innerHTML = '<option value="">No hay horas libres para este día</option>';
                    return;
                }

                availableHours.forEach(hour => {
                    const option = document.createElement('option');
                    option.value = hour;
                    option.textContent = hour;
                    timeSelect.appendChild(option);
                });

            } catch (error) {
                console.error("Error al consultar horas:", error);
                timeSelect.innerHTML = '<option value="">Error al cargar horas</option>';
            }
        });

        // Registrar la cita
        document.getElementById('bookBtn').addEventListener('click', async () => {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const date = dateInput.value;
            const time = timeSelect.value;
            const serviceData = document.getElementById('serviceSelect').value.split('|');
            const serviceName = serviceData[0];
            const servicePrice = serviceData[1];
            const statusDiv = document.getElementById('statusMessage');

            if (!name || !phone || !date || !time) {
                statusDiv.textContent = "Por favor, completa todos los campos y selecciona una hora.";
                statusDiv.className = "text-center text-sm mt-3 text-red-400 font-medium";
                statusDiv.classList.remove('hidden');
                return;
            }

            try {
                await db.collection('appointments').add({
                    barber: selectedBarber,
                    service: serviceName,
                    price: servicePrice,
                    clientName: name,
                    clientPhone: phone,
                    date: date,
                    time: time,
                    createdAt: new Date().toISOString()
                });

                statusDiv.textContent = "¡Cita reservada con éxito! Te esperamos en Gravity Salón.";
                statusDiv.className = "text-center text-sm mt-3 text-green-400 font-medium";
                statusDiv.classList.remove('hidden');
                
                // Limpiar formulario y refrescar horas
                document.getElementById('clientName').value = '';
                document.getElementById('clientPhone').value = '';
                dateInput.dispatchEvent(new Event('change'));
            } catch (error) {
                console.error("Error al guardar la cita:", error);
                statusDiv.textContent = "Hubo un error al reservar. Inténtalo de nuevo.";
                statusDiv.className = "text-center text-sm mt-3 text-red-400 font-medium";
                statusDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
