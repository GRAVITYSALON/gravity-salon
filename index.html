<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Salon - Sistema de Citas</title>
    <!-- Tailwind & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#d97706', 600: '#b45309' },
                        darkbg: '#121214',
                        darkcard: '#1e1e24',
                        darkborder: '#2e2e38'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #121214; color: white; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .gradient-border { border: 1px solid #2e2e38; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) brightness(100%); cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- HEADER -->
    <header class="w-full bg-darkcard/90 border-b border-darkborder sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-bold text-lg text-white">GRAVITY SALÓN</h1>
            <div class="flex gap-2">
                <button onclick="setMode('client')" class="bg-amber-600 px-3 py-1 rounded-lg text-xs font-bold">CLIENTE</button>
                <button onclick="setMode('admin')" class="bg-darkborder px-3 py-1 rounded-lg text-xs font-bold">BARBERÍA</button>
            </div>
        </div>
    </header>

    <!-- CONTENT -->
    <main class="max-w-4xl w-full p-4 space-y-6">
        <!-- VISTA CLIENTE (Simplificada para mantener diseño) -->
        <div id="view-client" class="space-y-6">
            <div class="bg-darkcard p-6 rounded-2xl border border-darkborder">
                <label class="block text-xs text-gray-400 mb-2">📅 SELECCIONA DÍA</label>
                <input type="date" id="booking-date" onchange="updateTimeSlots()" class="w-full bg-darkbg border border-darkborder rounded-xl p-3 text-sm">
                <div id="time-slots-container" class="grid grid-cols-4 gap-2 mt-4"></div>
            </div>
        </div>

        <!-- VISTA ADMIN -->
        <div id="view-admin" class="hidden space-y-6">
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-darkcard p-4 rounded-xl border border-darkborder">
                    <p class="text-[10px] text-gray-400 uppercase">Total Citas</p>
                    <p id="stat-today-count" class="text-xl font-bold">0</p>
                </div>
                <div class="bg-darkcard p-4 rounded-xl border border-darkborder">
                    <p class="text-[10px] text-gray-400 uppercase">Caja</p>
                    <p id="stat-revenue" class="text-xl font-bold text-amber-500">0€</p>
                </div>
                <div class="bg-darkcard p-4 rounded-xl border border-darkborder">
                    <p class="text-[10px] text-gray-400 uppercase">Ocupación</p>
                    <p id="stat-occupancy" class="text-xl font-bold text-emerald-500">0%</p>
                </div>
            </div>
            <input type="date" id="admin-date-filter" onchange="refreshAll()" class="w-full bg-darkcard border border-darkborder rounded-xl p-3 text-sm">
            <div id="barber-revenue-breakdown" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const app = initializeApp({
            apiKey: "AIzaSyCRop035RSLpoAbecHS1VWkRdubY3d6XHY",
            authDomain: "gravity-salon-a4c07.firebaseapp.com",
            projectId: "gravity-salon-a4c07",
            storageBucket: "gravity-salon-a4c07.firebasestorage.app",
            messagingSenderId: "170531909704",
            appId: "1:170531909704:web:4a75a23f07ccca8418287d"
        });
        const db = getFirestore(app);
        
        onSnapshot(collection(db, 'artifacts', 'gravity-barberia-app', 'public', 'data', 'appointments'), (snap) => {
            window.appointments = [];
            snap.forEach(d => window.appointments.push({id: d.id, ...d.data()}));
            refreshAll();
        });
    </script>

    <script>
        const SERVICES = [{ id: 's1', name: 'Corte', price: 10 }, { id: 's2', name: 'Corte + Barba', price: 13 }, { id: 's3', name: 'Completo', price: 15 }, { id: 's4', name: 'Infantil', price: 8 }];
        const BARBERS = [{ id: 'b2', name: 'Alejandro' }, { id: 'b1', name: 'Juanmi' }];
        const TIME_SLOTS = ['10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30'];
        window.appointments = JSON.parse(localStorage.getItem('gravity_appointments') || '[]');

        function getToday() { return new Date().toISOString().split('T')[0]; }

        function sendWhatsApp(phone, name, service, date, time) {
            const msg = `📅 Hola ${name}, te recordamos tu cita en Gravity Salón: ${service} el día ${date} a las ${time} h. ¡Te esperamos!`;
            window.open(`https://wa.me/34${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function refreshAll() {
            localStorage.setItem('gravity_appointments', JSON.stringify(window.appointments));
            updateTimeSlots();
            renderAdminAppointments();
        }

        function updateTimeSlots() {
            const date = document.getElementById('booking-date').value;
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const container = document.getElementById('time-slots-container');
            container.innerHTML = TIME_SLOTS.map(slot => {
                const [h, m] = slot.split(':').map(Number);
                const isPast = date === getToday() && (h * 60 + m) <= currentMins;
                const isBooked = window.appointments.some(a => a.date === date && a.time === slot);
                return `<div class="${isBooked || isPast ? 'bg-darkborder text-gray-600' : 'bg-amber-600'} p-2 rounded-lg text-center text-xs">${slot}</div>`;
            }).join('');
        }

        function renderAdminAppointments() {
            const date = document.getElementById('admin-date-filter').value;
            const container = document.getElementById('barber-revenue-breakdown');
            const dateApts = window.appointments.filter(a => a.date === date && a.status !== 'blocked');
            
            document.getElementById('stat-today-count').innerText = dateApts.length;
            document.getElementById('stat-revenue').innerText = dateApts.reduce((acc, a) => acc + (SERVICES.find(s => s.id === a.serviceId)?.price || 0), 0) + '€';
            
            container.innerHTML = BARBERS.map(b => {
                const bApts = dateApts.filter(a => a.barberId === b.id);
                return `
                    <div class="bg-darkcard p-4 rounded-xl border border-darkborder">
                        <h4 class="font-bold text-sm mb-3">${b.name}</h4>
                        <div class="space-y-2">
                            ${bApts.map(a => {
                                const s = SERVICES.find(sv => sv.id === a.serviceId);
                                return `<div class="bg-darkbg p-2 rounded flex justify-between items-center text-xs">
                                    <span>${a.time} - ${a.clientName}</span>
                                    <button onclick="sendWhatsApp('${a.clientPhone}', '${a.clientName}', '${s?.name}', '${a.date}', '${a.time}')" class="text-emerald-500"><i class="fa-brands fa-whatsapp"></i></button>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setMode(mode) {
            document.getElementById('view-client').classList.toggle('hidden', mode !== 'client');
            document.getElementById('view-admin').classList.toggle('hidden', mode !== 'admin');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('booking-date').value = getToday();
            document.getElementById('admin-date-filter').value = getToday();
            refreshAll();
        });
    </script>
</body>
</html>
